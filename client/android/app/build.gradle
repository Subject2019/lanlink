plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanlink.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lanlink.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
